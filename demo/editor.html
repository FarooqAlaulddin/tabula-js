<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tabula Editor</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="companion">
	<header class="companion-header">
		<h1>Tabula <span>Editor</span></h1>
		<span class="companion-status" id="status">Connecting...</span>
	</header>
	<div class="companion-body">
		<textarea id="editor" placeholder="Start typing... content syncs across all tabs."></textarea>
	</div>
</div>

<div class="overlay" id="overlay-auth">
	<div class="overlay-card">
		<h2>Logged Out</h2>
		<p>Another tab triggered a logout across all sessions.</p>
		<button class="btn btn-accent" id="btn-login">Log Back In</button>
	</div>
</div>

<script type="module">
import { createWorkspace } from 'tabula'

const NS = 'tabula-demo'
const app = createWorkspace(NS, { heartbeat: 1000, timeout: 4000 })
const statusEl = document.getElementById('status')
const editorEl = document.getElementById('editor')

// Claim after init — synced state applied automatically via pending-open
app.ready.then(() => {
	try {
		app.claim('editor')
		statusEl.textContent = 'Claimed "editor"'
	} catch (e) {
		statusEl.textContent = 'Claim failed: ' + e.message
	}
})

// Theme sync — reactive
app.state.on('theme', val => {
	document.documentElement.dataset.theme = val || 'light'
})

// Auth sync
app.state.on('auth', val => {
	if (val === 'logged-out') {
		document.getElementById('overlay-auth').classList.add('active')
	} else {
		document.getElementById('overlay-auth').classList.remove('active')
	}
})

document.getElementById('btn-login').onclick = () => {
	app.state.set('auth', 'logged-in')
}

// Editor content: debounced local → state
let debounceTimer
editorEl.addEventListener('input', () => {
	clearTimeout(debounceTimer)
	debounceTimer = setTimeout(() => {
		app.state.set('editorContent', editorEl.value)
	}, 100)
})

// Editor content: state → local (from other tabs)
app.state.on('editorContent', val => {
	if (document.activeElement !== editorEl) {
		editorEl.value = val ?? ''
	}
})

// Init: apply state once ready
app.ready.then(() => {
	const theme = app.state.get('theme')
	if (theme) document.documentElement.dataset.theme = theme

	const content = app.state.get('editorContent')
	if (content && !editorEl.value) editorEl.value = content
})
</script>
</body>
</html>
