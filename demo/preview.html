<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tabula Preview</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="companion">
	<header class="companion-header">
		<h1>Tabula <span>Preview</span></h1>
		<span class="companion-status" id="status">Connecting...</span>
	</header>
	<div class="companion-body">
		<div class="preview-content" id="preview">Waiting for editor content...</div>
	</div>
</div>

<div class="overlay" id="overlay-auth">
	<div class="overlay-card">
		<h2>Logged Out</h2>
		<p>Another tab triggered a logout across all sessions.</p>
		<button class="btn btn-accent" id="btn-login">Log Back In</button>
	</div>
</div>

<script type="module">
import { createWorkspace } from '@farooqalaulddin/tabula-js'

const NS = 'tabula-demo'
const app = createWorkspace(NS, { heartbeat: 1000, timeout: 4000 })
const statusEl = document.getElementById('status')
const previewEl = document.getElementById('preview')

// Claim after init
app.ready.then(async () => {
	try {
		const result = await app.claim('preview')
		statusEl.textContent = result.status === 'claimed' ? 'Claimed "preview"' : 'Preview already open'
	} catch (e) {
		statusEl.textContent = 'Claim failed: ' + e.message
	}
})

// Theme sync — reactive
app.state.on('theme', val => {
	document.documentElement.dataset.theme = val || 'light'
})

// Auth sync
app.state.on('auth', val => {
	if (val === 'logged-out') {
		document.getElementById('overlay-auth').classList.add('active')
	} else {
		document.getElementById('overlay-auth').classList.remove('active')
	}
})

document.getElementById('btn-login').onclick = () => {
	app.state.set('auth', 'logged-in')
}

// Editor content: live preview — reactive
app.state.on('editorContent', val => {
	previewEl.textContent = val || 'Waiting for editor content...'
})

// Init: apply state once ready
app.ready.then(() => {
	const theme = app.state.get('theme')
	if (theme) document.documentElement.dataset.theme = theme

	const content = app.state.get('editorContent')
	if (content) previewEl.textContent = content
})
</script>
</body>
</html>
